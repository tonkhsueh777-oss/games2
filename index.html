<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10181b"><title>灯隙 · 末班车</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loadingScreen" class="loading-screen" role="dialog" aria-modal="true" aria-labelledby="loadTitle"><div class="loading-inner"><div class="lamp-mark" aria-hidden="true"><span></span></div><h1 id="loadTitle">灯隙</h1><p class="load-story">在黑暗抵达之前，<br>让这盏灯，准备好所有的光。</p><div class="load-numbers"><span id="loadCount">影片就绪 0 / 8</span><strong id="loadPercent">0%</strong></div><progress id="loadBar" max="100" value="0" aria-label="全部影片加载进度"></progress><p id="loadMessage" role="status" aria-live="polite">正在准备全部影片，请保持页面打开。</p><button id="loadRetry" class="primary" hidden>重试未完成的影片</button><button id="loadEnter" class="primary" hidden>全部就绪 · 进入灯隙</button><small>首次需加载约 10 MB · 全部影片就绪后开启旅程</small></div></div><div id="gameShell" inert aria-hidden="true"><main class="stage" id="stage">
<div class="picture"><img id="poster" src="media/C08.jpg" alt="深夜地铁中的猎人"><video id="film" playsinline webkit-playsinline preload="metadata" muted></video><div class="shade"></div></div>
<header><span class="wordmark">灯 隙</span><span id="chapter">末班车</span><button id="sound" aria-label="开启声音">声音 关</button><button id="pause" hidden>暂停</button></header>
<div class="status" id="status" hidden><span id="health"></span><span id="charge"></span><span id="coins"></span></div>
<div id="notice" role="status" aria-live="polite"></div>
<div class="center" id="center"></div>
<section id="panel" class="panel" aria-live="polite"></section>
<div id="gesture" class="gesture" hidden><svg id="trace" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="line" fill="none" stroke="#e8bc72" stroke-width="1"/></svg><div class="target" id="target"></div><div class="gesture-copy"><strong id="gestureTitle"></strong><p id="gestureHint"></p><progress id="progress" max="100" value="0"></progress><button id="assist">辅助完成此动作</button></div></div>
<footer><span>东方灯械 · 互动影游</span><button id="restart">重新开始</button></footer>
</main><aside class="desktop-note"><span>灯隙</span><p>最后一班车，<br>还有一盏灯。</p><small>戴上耳机 · 竖屏体验<br>点击、滑动、长按，让故事继续。</small></aside></div><script src="app.js"></script><script src="loader.js"></script></body></html>
